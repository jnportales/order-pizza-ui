default:
  tags:
    - jp-runner
stages:
  - setup
  - test
  - build
  - publish
  - deploy

# store node_modules
npm:install:
  stage: setup
  script:
    - npm install
  artifacts:
    paths:
      - ./node_modules
    expire_in: 1 hour

# run unit and component tests
npm:test:
  stage: test
  script:
    - npm test

npm:test:jsdom:
  stage: test
  script:
    - npm run test:jsdom
#-----------------------------

# build and store dist for downstream
npm:build:
  stage: build
  script: npm run build
  artifacts:
    paths:
      - ./dist
    expire_in: 1 hour

# build distributable image and publish to gitlab container registry
docker:publish:
  image: docker:cli
  variables:
    # image tage to include branch name and short commit sha
    IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  rules:
    # on tag pipeline use CI tag for image tag
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - when: always
  stage: publish
  script:                    #registry.gitlab.com/group/project
    - "docker build -t ${CI_REGISTRY_IMAGE}:${IMAGE_TAG} ."
    - echo "${CI_JOB_TOKEN}" | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
    - "docker push ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"

docker:compose:
  stage: deploy
  tags:
    - deploy
  variables:
    IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    CONTAINER_NAME: "test-order-pizza-ui"
  script:
    - docker compose -f appserver.docker-compose.yml up -d $CONTAINER_NAME
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: $IMAGE_TAG
        CONTAINER_NAME: prod-order-pizza-ui

    - when: always

