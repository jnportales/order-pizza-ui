default:
  tags:
    - jp-runner
stages:
  - setup
  - test
  - build
  - publish

# store node_modules
npm:install:
  stage: setup
  script:
    - npm install
  artifacts:
    paths:
      - ./node_modules
    expire_in: 1 hour

# run unit and component tests
npm:test:
  stage: test
  script:
    - npm test

npm:test:jsdom:
  stage: test
  script:
    - npm run test:jsdom
#-----------------------------

# build and store dist for downstream
npm:build:
  stage: build
  script: npm run build
  artifacts:
    paths:
      - ./dist
    expire_in: 1 hour

# build distributable image and publish to gitlab container registry
docker:publish:
  # variables:
  #   DOCKER_HOST: unix:///var/run/docker.sock
  image: docker:cli
  stage: publish
  script:                    #registry.gitlab.com/group/project
    - "docker build -t ${CI_TEMPLATE_REGISTRY_HOST}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA} ."
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - "docker push ${CI_TEMPLATE_REGISTRY_HOST}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}"