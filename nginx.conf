server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep index.html uncached so browsers pick up new bundle.js builds
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Block third-party license text files from being served publicly (optional)
    location ~* \.LICENSE\.txt$ {
        deny all;
        return 404;
    }

    # Serve bundle.js and other static assets, falling back to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}